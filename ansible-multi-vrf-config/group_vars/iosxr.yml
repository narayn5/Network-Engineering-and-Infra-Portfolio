---
# VRF Definitions
vrfs:
  - name: VRF-Production
    description: "Production traffic"
    loopback_id: 10
    loopback_ip: "10.10.10.10"
    static_routes:
      - destination: "192.168.1.0/24"
        next_hop: "Loopback10"
      - destination: "172.16.0.0/16"
        next_hop: "Loopback10"

  - name: VRF-Management
    description: "Management and monitoring"
    loopback_id: 20
    loopback_ip: "10.20.20.20"
    static_routes:
      - destination: "192.168.2.0/24"
        next_hop: "Loopback20"

  - name: VRF-Testing
    description: "Testing and development"
    loopback_id: 30
    loopback_ip: "10.30.30.30"
    static_routes:
      - destination: "192.168.3.0/24"
        next_hop: "Loopback30"

# Report settings
report_path: "./reports/vrf_report.html"
